name: Clean-room checks

on:
  push:
  pull_request:

jobs:
  clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Copy detector
        run: node cleanroom/check/fingerprint.mjs scan cleanroom/check/reference.fp . --fail --top 40
      - name: Off-limits sources
        run: node cleanroom/check/addresses.mjs
